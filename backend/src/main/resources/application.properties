spring.application.name=ledgerline-backend

# Local development: read backend/.env when it exists. Real environment variables take precedence,
# and "optional:" means production runs fine without the file.
spring.config.import=optional:file:.env[.properties]

# Runtime connection: the application role, which owns no tables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Migrations: Flyway opens its own connection as the owner role, to the same database.
# Note: this means the owner credentials are present whenever the app starts. Production can instead set
# spring.flyway.enabled=false and run migrations as a separate deployment step.
spring.flyway.user=${DB_OWNER_USERNAME}
spring.flyway.password=${DB_OWNER_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.app_role=${DB_USERNAME}
spring.flyway.clean-disabled=true

# Access tokens: HS256, signed with JWT_SECRET (Base64, at least 32 bytes). 15-minute lifetime, no refresh tokens.
ledgerline.jwt.secret=${JWT_SECRET}
ledgerline.jwt.issuer=ledgerline
ledgerline.jwt.access-token-ttl=15m
ledgerline.security.bcrypt-strength=12
ledgerline.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Login limits (failed + in-progress attempts), in memory per application instance (reset on restart). See README.md.
ledgerline.login-rate-limit.enabled=true
ledgerline.login-rate-limit.max-failures-per-email=5
ledgerline.login-rate-limit.max-failures-per-ip=50
ledgerline.login-rate-limit.window=15m
ledgerline.login-rate-limit.max-tracked-keys=100000

# Registration attempts per client IP (successful and duplicate-email attempts both count). See README.md.
ledgerline.registration-rate-limit.enabled=true
ledgerline.registration-rate-limit.max-attempts-per-ip=10
ledgerline.registration-rate-limit.window=1h
ledgerline.registration-rate-limit.max-tracked-keys=100000

# Flyway owns the schema. Hibernate may only check that entities match it, never create or alter tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
