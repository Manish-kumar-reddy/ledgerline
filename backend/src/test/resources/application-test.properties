# Integration tests only. Activated by the integration-tests Maven profile (./mvnw verify -Pintegration-tests).
# Roles and passwords are the same as for development; only the database differs.
spring.datasource.url=${TEST_DB_URL}
spring.datasource.hikari.maximum-pool-size=3
# Integration tests register many users from the same MockMvc address (127.0.0.1). The production default
# (10 per hour) would block them, so the shared test context raises it. Rate-limit behaviour itself is tested in
# LoginRateLimitIT and RegistrationRateLimitIT, which set their own low limits.
ledgerline.registration-rate-limit.max-attempts-per-ip=10000
